[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "problem-locator"
version = "1.0.0"
description = "Problem Locator V1"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic==2.13.4",
]

[project.scripts]
problem-locator-logparse = "problem_locator.integrations.logparse.cli:main"

[dependency-groups]
dev = [
  "jsonschema==4.25.1",
  "pytest==9.0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/problem_locator"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
pythonpath = ["src"]
testpaths = ["tests/contracts"]
