[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "problem-locator"
version = "1.0.7"
description = "Problem Locator V2"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic==2.13.4",
  "mcp==1.29.0",
  "fastapi==0.139.2",
  "uvicorn==0.49.0",
  "python-dotenv==1.2.2",
]

[project.scripts]
problem-locator-logparse = "problem_locator.integrations.logparse.cli:main"
problem-locator-pack-result = "problem_locator.integrations.result_archive:main"
problem-locator-seal-outcome-draft = "problem_locator.runtime.outcome_finalizer:main"

[dependency-groups]
dev = [
  "jsonschema==4.25.1",
  "pytest==9.0.2",
  "httpx==0.28.1",
  "starlette==1.3.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/problem_locator"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
pythonpath = ["src"]
testpaths = ["tests/contracts", "tests/unit", "tests/integration", "tests/e2e"]
